<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#1D4ED8" />

    <!-- PWA Manifest & App Identity -->
    <link rel="manifest" href="/manifest.json" />
    <title>FUTPLAY LITE · Liga de Jogadores de Futebol Amador de Planalto - BA</title>
    <meta name="description" content="Liga de Futebol Amador de Planalto - BA: Súmula Digital, Ranking Oficial, Mensalidades e Avaliação de Atletas" />

    <!-- Ícones e Favicon -->
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
    <link rel="alternate icon" type="image/png" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Apple iOS PWA Meta Tags -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="FutPlay Lite" />
    <meta name="application-name" content="FutPlay Lite" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Tipografia Oficial -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&family=Oswald:wght@600;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-slate-200 text-slate-900 antialiased selection:bg-blue-600 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Registro Automático do Service Worker PWA -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch((err) => {
            console.warn('Registro do Service Worker falhou:', err);
          });
        });
      }
    </script>
  </body>
</html>
